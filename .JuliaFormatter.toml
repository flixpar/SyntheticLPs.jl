style = "blue"
margin = 100
always_for_in = true
whitespace_typedefs = true
whitespace_ops_in_indices = true
remove_extra_newlines = true
import_to_using = false
pipe_to_function_call = false
short_to_long_function_def = false
always_use_return = false
# Keep this disabled: it rewrites any bare string literal that precedes another
# expression into a triple-quoted docstring, which silently appends a newline.
# That corrupts the option names in the `@add_arg_table!` blocks under scripts/.
format_docstrings = false
normalize_line_endings = "unix"

# `format(".")` walks every directory, `.git` included. Branch names ending in
# `.jl` -- unavoidable in a repository called SyntheticLPs.jl -- leave ref and
# reflog files whose names end in `.jl`, and the formatter tries to parse them
# and warns loudly. The warnings are harmless (they do not fail the check) but
# they bury the real output, so skip the directory.
ignore = [".git"]
